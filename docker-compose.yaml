services:
  bot:
    build:
      context: .
    env_file:
      - .env
    restart: always
    depends_on:
      - postgres
    networks: 
      - bot_net
    
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: 
      - bot_net

volumes:
  postgres_data:

networks:
  bot_net:
    driver: bridge